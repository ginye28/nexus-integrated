# NEXUS EDGE — 실제 pfSense(HAProxy 패키지 + 방화벽 규칙)와 같은 동작을 컨테이너로 재현한 경계 장비.
# pfSense 설정(config-pfSense-kry...xml) 기준:
#   WAN 5070 허용 -> HAProxy portal_frontend(5070) -> portal_backend(포털 5070)
#   차단 순서: pfB_GeoBlock_CRK -> pfB_PRI1 -> XDR_BLOCKED_IPS(포털 피드) -> NEXUS_AUTO_BLOCK -> 그 외 허용
global
    log graylog:1514 local0 info
    maxconn 2000
    stats socket /var/run/haproxy.sock mode 600 level admin

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client  90s
    timeout server  90s

frontend portal_frontend
    bind *:5070
    # 차단 목록 (edge 의 sync/fetch 스크립트가 파일을 갱신하고 HAProxy 를 다시 읽게 한다)
    acl geo_block         src -f /run/edge/geoblock.txt
    acl pri1_block        src -f /run/edge/pri1.txt
    acl xdr_blocked       src -f /run/edge/xdr_blocked_ips.txt
    acl nexus_auto_block  src -f /run/edge/nexus_auto_block.txt
    http-request deny deny_status 403 if geo_block
    http-request deny deny_status 403 if pri1_block
    http-request deny deny_status 403 if xdr_blocked
    http-request deny deny_status 403 if nexus_auto_block
    default_backend portal_backend

# pfSense HAProxy 패키지의 localstats(2200) 와 같은 통계 화면: http://127.0.0.1:2200/
listen stats
    bind *:2200
    mode http
    stats enable
    stats uri /
    stats refresh 5s

backend portal_backend
    option httpchk GET /healthz
    server portal1 portal:5070 check
